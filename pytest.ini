[pytest]
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: fast tests with no HTTP or browser
    integration: Django test client against a copy of the seeded database
    smoke: minimal checks that are safe to run after every deploy
    e2e: browser tests (Playwright)
    perf: load and performance tests
