name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_perf:
        description: Run the performance suite
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'

env:
  SECRET_KEY: ci-only-secret-key
  DEBUG: 'True'
  ALLOWED_HOSTS: localhost,127.0.0.1

permissions:
  contents: read

jobs:
  unit-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py collectstatic --noinput
      - run: pytest tests/unit tests/integration

  e2e:
    runs-on: ubuntu-latest
    needs: unit-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py collectstatic --noinput
      - run: playwright install --with-deps chromium
      - run: pytest tests/e2e --tracing retain-on-failure --output test-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results

  performance:
    if: github.event_name == 'schedule' || inputs.run_perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: python manage.py collectstatic --noinput
      - name: Start app
        run: |
          gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 2 --daemon
          sleep 3
      - name: Run Locust with budgets
        run: >
          locust -f tests/performance/locustfile.py --headless
          -u 20 -r 5 -t 1m --host http://127.0.0.1:8000
          --csv tests/reports/perf --html tests/reports/perf.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: tests/reports
